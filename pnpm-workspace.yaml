packages:
  - "apps/*"
  - "packages/*"

# Security advisories: pin transitive copies to patched versions, one entry per
# vulnerable major line so nothing jumps across a major unnecessarily.
overrides:
  "dompurify@<3.4.17": 3.4.17
  "undici@>=7 <7.30.1": 7.30.1
  "nanoid@<3.3.18": 3.3.18
  "nanoid@>=4 <5.1.16": 5.1.16
  "lodash-es@<4.18.0": 4.18.1
  "zod@<4.6.6": 4.6.6
  "minimatch@>=7 <11.0.1": 11.0.1
  "katex@<0.18.2": 0.18.2
