# Release: pushing a tag vMAJOR.MINOR.PATCH builds the Windows installer, the macOS (Apple Silicon) .dmg, the Linux .deb and the
# kb-server tarball, and publishes a release (a pre-release for an -rc tag; installers carry the numeric version) with generated notes, SHA256SUMS and build provenance.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must be on main. The version embedded in the installers is the tag without the `v`.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      stem: ${{ steps.v.outputs.stem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG#v}"
          echo "version=${name%%-*}" >> "$GITHUB_OUTPUT"
          echo "stem=atomik-kb-${name}" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag $TAG is not on main; release from a commit that is merged."
            exit 1
          fi

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/_build.yml
    with:
      stem: ${{ needs.prepare.outputs.stem }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit # only the optional KB_GOOGLE_CLIENT_* secrets are read

  publish:
    name: Publish the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: out
          merge-multiple: true

      - name: Checksums
        run: |
          cd out
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*

      - name: Create the release
        run: |
          {
            echo "Unsigned build. Verify a download with SHA256SUMS or"
            echo "\`gh attestation verify <file> --repo ${GH_REPO}\`."
          } > notes.md
          case "$TAG" in
            *-*) channel="--prerelease" ;;
            *) channel="--latest" ;;
          esac
          gh release create "$TAG" out/* \
            --verify-tag \
            "$channel" \
            --title "atomik-kb ${TAG#v}" \
            --generate-notes \
            --notes-file notes.md
