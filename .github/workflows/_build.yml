# Reusable build of the distributable files, called by nightly.yml and release.yml.
#
#   windows  the unsigned per-user NSIS installer         (scripts/package/windows.ps1)
#   linux    the .deb and the kb-server binary tarball    (the repo's Ubuntu 22.04 Docker image,
#                                                          scripts/package/linux/, so the glibc floor is 2.35)
#   macos    the unsigned, ad-hoc signed Apple Silicon .dmg (scripts/package/macos/build.sh)
#
# Output: three workflow artifacts, "dist-windows", "dist-linux" and "dist-macos", with files named
# <stem>-<platform>.<ext>. The caller publishes them. No secrets are required: when the repository
# secrets KB_GOOGLE_CLIENT_ID / KB_GOOGLE_CLIENT_SECRET exist (callers pass `secrets: inherit`), they become the
# built-in Google Drive client (ADR-0059); without them the build has no built-in client and the user supplies
# their own in Settings.
name: Build distributables

on:
  workflow_call:
    inputs:
      stem:
        description: "File name stem, e.g. atomik-kb-nightly-20261027-abc1234"
        type: string
        required: true
      version:
        description: "MAJOR.MINOR.PATCH to embed; empty means 0.1.<commit count>"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Repeats .cargo/config.toml (RUSTFLAGS overrides it): LNK4099 from the vendored OpenSSL fails -D warnings builds.
      RUSTFLAGS: "-C link-arg=/ignore:4099"
      STEM: ${{ inputs.stem }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      # Full history: the default version is 0.1.<commit count>.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "25.5.0"
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # perl and NASM build OpenSSL for SQLCipher; both ship on the runner image, the install is a fallback.
      - name: Check perl and NASM
        shell: pwsh
        run: |
          perl --version | Select-Object -First 2
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      # Only when both secrets exist (an empty value would still count as "set" at compile time).
      - name: Google Drive client (optional)
        shell: bash
        env:
          GOOGLE_ID: ${{ secrets.KB_GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.KB_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_ID" ] && [ -n "$GOOGLE_SECRET" ]; then
            echo "KB_GOOGLE_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"
            echo "KB_GOOGLE_CLIENT_SECRET=$GOOGLE_SECRET" >> "$GITHUB_ENV"
            echo "Built-in Google client: present"
          else
            echo "Built-in Google client: absent (the build works without it)"
          fi

      - run: pnpm install --frozen-lockfile

      # windows.ps1 fetches the speech dependencies, builds the MCP bridge and the dictation sidecar,
      # runs `tauri build`, and copies the installer to dist/installers/.
      - name: Build the NSIS installer
        shell: powershell
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version) { $version = "0.1." + (git rev-list --count HEAD).Trim() }
          Write-Host "Version $version"
          & .\scripts\package\windows.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Name the file
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          files=(dist/installers/*-setup.exe)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected exactly one installer, found ${#files[@]}"; exit 1; }
          cp "${files[0]}" "out/${STEM}-windows-x64-setup.exe"
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: out/*
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux .deb and kb-server
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STEM: ${{ inputs.stem }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Google Drive client (optional)
        env:
          GOOGLE_ID: ${{ secrets.KB_GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.KB_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_ID" ] && [ -n "$GOOGLE_SECRET" ]; then
            echo "KB_GOOGLE_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"
            echo "KB_GOOGLE_CLIENT_SECRET=$GOOGLE_SECRET" >> "$GITHUB_ENV"
            echo "Built-in Google client: present"
          else
            echo "Built-in Google client: absent (the build works without it)"
          fi

      # The tauri config has no version of its own; set it in this checkout (never committed) so the .deb carries it.
      - name: Set the version
        run: |
          version="$INPUT_VERSION"
          [ -n "$version" ] || version="0.1.$(git rev-list --count HEAD)"
          echo "Version $version"
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "$version" '.version = $v' "$conf" > "$RUNNER_TEMP/tauri.conf.json"
          cp "$RUNNER_TEMP/tauri.conf.json" "$conf"

      # The same image scripts/package/linux.ps1 builds, with the versions the repo pins.
      - name: Build the build image
        run: |
          rust=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          pnpm=$(sed -n 's/.*"packageManager": *"pnpm@\([^"]*\)".*/\1/p' package.json)
          [ -n "$rust" ] && [ -n "$pnpm" ] || { echo "::error::cannot read the rust or pnpm version"; exit 1; }
          docker build -t atomik-kb-linux-build:ubuntu22.04 \
            --build-arg "RUST_VERSION=$rust" --build-arg "NODE_VERSION=25.5.0" --build-arg "PNPM_VERSION=$pnpm" \
            scripts/package/linux

      # The working tree (tracked files, with the version edit above) is streamed into throwaway containers;
      # the checkout itself is never mounted.
      - name: Pack the source
        run: git ls-files -z | tar --null -T - -cf "$RUNNER_TEMP/source.tar"

      - name: Build the .deb
        run: |
          envs=()
          [ -z "${KB_GOOGLE_CLIENT_ID:-}" ] || envs+=(-e KB_GOOGLE_CLIENT_ID)
          [ -z "${KB_GOOGLE_CLIENT_SECRET:-}" ] || envs+=(-e KB_GOOGLE_CLIENT_SECRET)
          docker create --name kb-deb "${envs[@]}" atomik-kb-linux-build:ubuntu22.04 bash /build/build-in-container.sh
          docker cp "$RUNNER_TEMP/source.tar" kb-deb:/build/source.tar
          docker cp scripts/package/linux/build-in-container.sh kb-deb:/build/build-in-container.sh
          docker start -a kb-deb
          mkdir -p deb
          docker cp kb-deb:/build/out/. deb/
          docker rm -f kb-deb
          ls -l deb

      # The sync server, built in the same Ubuntu 22.04 image so it runs on any glibc >= 2.35 host.
      - name: Build kb-server
        run: |
          mkdir -p server
          docker run --rm \
            -v "$RUNNER_TEMP/source.tar:/src.tar:ro" -v "$PWD/server:/out" \
            atomik-kb-linux-build:ubuntu22.04 \
            bash -euc 'mkdir /w && tar -xmf /src.tar -C /w && cd /w && cargo build --release --locked -p kb-server && install -m 0755 target/release/kb-server /out/kb-server && cp LICENSE /out/LICENSE'
          sudo chown -R "$(id -u):$(id -g)" server
          ls -l server

      - name: Name the files
        run: |
          mkdir -p out
          debs=(deb/atomik-kb_*.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected exactly one .deb, found ${#debs[@]}"; exit 1; }
          cp "${debs[0]}" "out/${STEM}-linux-amd64.deb"
          tar -czf "out/${STEM}-linux-x86_64-kb-server.tar.gz" -C server kb-server LICENSE
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: out/*
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS .dmg
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 120
    env:
      STEM: ${{ inputs.stem }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "25.5.0"
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Google Drive client (optional)
        env:
          GOOGLE_ID: ${{ secrets.KB_GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.KB_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_ID" ] && [ -n "$GOOGLE_SECRET" ]; then
            echo "KB_GOOGLE_CLIENT_ID=$GOOGLE_ID" >> "$GITHUB_ENV"
            echo "KB_GOOGLE_CLIENT_SECRET=$GOOGLE_SECRET" >> "$GITHUB_ENV"
            echo "Built-in Google client: present"
          else
            echo "Built-in Google client: absent (the build works without it)"
          fi

      # The tauri config has no version of its own; set it in this checkout (never committed) so the app carries it.
      - name: Set the version
        run: |
          version="$INPUT_VERSION"
          [ -n "$version" ] || version="0.1.$(git rev-list --count HEAD)"
          echo "Version $version"
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "$version" '.version = $v' "$conf" > "$RUNNER_TEMP/tauri.conf.json"
          cp "$RUNNER_TEMP/tauri.conf.json" "$conf"

      - run: pnpm install --frozen-lockfile

      # Builds the two sidecars (MCP bridge, dictation) with the sherpa-onnx libraries, then `tauri build` (ad-hoc signed).
      - name: Build the .dmg
        run: bash scripts/package/macos/build.sh

      - name: Name the file
        run: |
          mkdir -p out
          dmgs=(dist/macos/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::expected exactly one .dmg, found ${#dmgs[@]}"; exit 1; }
          cp "${dmgs[0]}" "out/${STEM}-macos-arm64.dmg"
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: out/*
          if-no-files-found: error
          retention-days: 3
