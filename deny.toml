# cargo-deny configuration (ADR-0010 license policy, ADR-0012 banned crates).

[graph]
all-features = false
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-linux-android",
  "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked = "deny"
# "unmaintained" notices are not vulnerabilities. Fail only for crates this workspace
# depends on directly; transitive ones (e.g. `im` and `sized-chunks` under Loro) stay
# visible as warnings and are reviewed when their parent crate is updated.
unmaintained = "workspace"
# Known transitive "unmaintained" notices at the time of writing (warnings, not errors):
# proc-macro-error (gtk-rs 0.18 under Tauri on Linux, compile-time only), im and
# sized-chunks (under loro-internal). Re-check when Tauri and Loro update.
ignore = [
  # SQLite before 3.54.0 can return uninitialised page-cache memory when it opens a database with a
  # crafted sibling -wal file of a different page size (local; needs files a less trusted party wrote).
  # The app and the server only open SQLite files they created themselves; no importer opens SQLite.
  # No release fixes our build yet: rusqlite 0.41 (libsqlite3-sys 0.39) is blocked on a
  # rusqlite_migration release, and libsqlite3-sys 0.39's bundled-sqlcipher still bundles SQLite 3.53.4.
  # Remove when a libsqlite3-sys whose bundled SQLCipher has SQLite >= 3.54 (sqlcipher-src >= 420) is usable.
  { id = "RUSTSEC-2026-0459", reason = "SQLite WAL page-size bug; only self-written databases are opened; no fixed SQLCipher build released" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "GPL-3.0-or-later", # this project itself
]
confidence-threshold = 0.9

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # ADR-0012: one SQLite stack; these conflict on libsqlite3-sys or bypass SQLCipher.
  { crate = "sqlx", reason = "ADR-0012: rusqlite only" },
  { crate = "diesel", reason = "ADR-0012: rusqlite only" },
  { crate = "tauri-plugin-sql", reason = "ADR-0012: the core owns the database" },
  # Deprecated keystore plugin; we use the keyring crate.
  { crate = "tauri-plugin-stronghold", reason = "deprecated upstream" },
  # Unaudited or legacy crypto; ADR-0013 fixes the primitive set.
  { crate = "orion", reason = "ADR-0013" },
  { crate = "sodiumoxide", reason = "unmaintained" },
  # The Rust `openssl` bindings are not used; only libsqlite3-sys links the vendored C library.
  { crate = "openssl", reason = "ADR-0013: pure-Rust crypto only; SQLCipher links OpenSSL internally" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
